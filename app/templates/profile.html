{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center -mt-6">
    <div class="w-full max-w-lg">
        <div class="text-center mb-8">
            <h1 class="text-xl font-semibold text-navy-950">Your Profile</h1>
            <p class="text-steel-500 text-sm mt-1">Update your name and profile picture</p>
        </div>

        <div class="bg-white rounded-xl border border-steel-200 p-8">
            <form method="POST" enctype="multipart/form-data" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="flex flex-col items-center mb-6">
                    {% if picture_url %}
                    <img src="{{ picture_url }}" alt="Profile picture" class="w-24 h-24 rounded-full object-cover border-2 border-steel-200 mb-3">
                    {% else %}
                    <div class="w-24 h-24 rounded-full bg-navy-950 flex items-center justify-center text-white text-2xl font-semibold mb-3">
                        {{ (current_user.first_name[0] if current_user.first_name else current_user.email[0])|upper }}
                    </div>
                    {% endif %}
                    <label class="text-signal text-sm font-medium cursor-pointer hover:underline">
                        Change photo
                        <input type="file" name="profile_picture" accept=".png,.jpg,.jpeg" class="hidden">
                    </label>
                </div>

                <div>
                    <label class="block text-sm font-medium text-steel-500 mb-1.5">First Name</label>
                    <input type="text" name="first_name" value="{{ current_user.first_name or '' }}" class="w-full border border-steel-200 rounded px-3 py-2 text-navy-950 focus:outline-none focus:ring-2 focus:ring-signal">
                </div>
                <div>
                    <label class="block text-sm font-medium text-steel-500 mb-1.5">Last Name</label>
                    <input type="text" name="last_name" value="{{ current_user.last_name or '' }}" class="w-full border border-steel-200 rounded px-3 py-2 text-navy-950 focus:outline-none focus:ring-2 focus:ring-signal">
                </div>
                <div>
                    <label class="block text-sm font-medium text-steel-500 mb-1.5">Email</label>
                    <input type="email" value="{{ current_user.email }}" disabled class="w-full border border-steel-200 rounded px-3 py-2 text-steel-400 bg-steel-50">
                </div>

                <button type="submit" class="w-full bg-navy-950 text-white py-2.5 rounded font-medium hover:bg-navy-900 transition text-sm">Save Profile</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
