{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center -mt-8">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-xl font-semibold text-navy-950">Reset Password</h1>
            <p class="text-steel-500 text-sm mt-1">Enter the code your administrator gave you.</p>
        </div>
        <div class="bg-white rounded-lg border border-steel-200 p-8">
            <form method="POST" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div>
                    <label class="block text-sm font-medium text-steel-500 mb-1.5">Email</label>
                    <input type="email" name="email" required class="w-full border border-steel-200 rounded px-4 py-2.5 text-navy-950 focus:outline-none focus:ring-2 focus:ring-signal">
                </div>
                <div>
                    <label class="block text-sm font-medium text-steel-500 mb-1.5">One-Time Code</label>
                    <input type="text" name="otp" required maxlength="6" class="w-full border border-steel-200 rounded px-4 py-2.5 text-navy-950 focus:outline-none focus:ring-2 focus:ring-signal">
                </div>
                <div>
                    <label class="block text-sm font-medium text-steel-500 mb-1.5">New Password</label>
                    <input type="password" name="new_password" required minlength="8" class="w-full border border-steel-200 rounded px-4 py-2.5 text-navy-950 focus:outline-none focus:ring-2 focus:ring-signal">
                </div>
                <div>
                    <label class="block text-sm font-medium text-steel-500 mb-1.5">Confirm New Password</label>
                    <input type="password" name="confirm_password" required minlength="8" class="w-full border border-steel-200 rounded px-4 py-2.5 text-navy-950 focus:outline-none focus:ring-2 focus:ring-signal">
                </div>
                <button type="submit" class="w-full bg-navy-950 text-white py-2.5 rounded font-medium hover:bg-navy-900 transition">Reset Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
