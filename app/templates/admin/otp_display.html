{% extends "base.html" %}
{% block title %}Reset Code{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="bg-white rounded-lg border border-steel-200 p-8 text-center">
        <p class="text-steel-500 text-sm mb-2">One-time reset code for</p>
        <p class="text-navy-950 font-semibold mb-6">{{ user_email }}</p>
        <div class="bg-steel-50 border border-steel-200 rounded-lg py-6 mb-6">
            <p class="text-3xl font-bold text-navy-950 tracking-widest">{{ otp_code }}</p>
        </div>
        <p class="text-steel-400 text-xs mb-6">Valid for 30 minutes. Relay this code to the user directly — it will not be shown again.</p>
        <a href="{{ url_for('web_admin.password_resets') }}" class="inline-block bg-navy-950 text-white px-6 py-2.5 rounded font-medium hover:bg-navy-900 transition text-sm">Back to Requests</a>
    </div>
</div>
{% endblock %}
