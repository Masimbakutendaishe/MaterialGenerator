{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="fixed inset-0" style="z-index: -1; background-image: linear-gradient(135deg, rgba(10, 22, 40, 0.65), rgba(10, 22, 40, 0.55)), url('{{ url_for('static', filename='img/login-bg.jpg') }}'); background-size: cover; background-position: center;"></div>

<div class="relative flex items-center justify-center" style="min-height: 70vh;">
    <div class="w-full max-w-md px-4">
        <div class="bg-white/95 backdrop-blur-sm rounded-[2rem] px-10 py-8 mb-6 text-center"
             style="box-shadow: 0 20px 25px -5px rgba(0,0,0,0.25), 0 10px 10px -5px rgba(0,0,0,0.15), 0 1px 0 rgba(255,255,255,0.5) inset;">
            <img src="{{ url_for('static', filename='img/logo_transparent.png') }}" alt="Learning Material Generator" class="h-20 w-auto mx-auto mb-4">
            <h1 class="text-2xl font-semibold text-navy-950">Learning Material Generator</h1>
            <p class="text-steel-500 text-sm mt-1">Workplace training materials, done right.</p>
        </div>

        <div class="bg-white rounded-[1.5rem] p-8"
             style="box-shadow: 0 20px 25px -5px rgba(0,0,0,0.25), 0 10px 10px -5px rgba(0,0,0,0.15), 0 1px 0 rgba(255,255,255,0.5) inset;">
            <h2 class="text-base font-semibold text-navy-900 mb-6 uppercase tracking-wide text-sm">Sign In</h2>
            <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div>
                    <label class="block text-sm font-medium text-steel-500 mb-1.5">Email</label>
                    <input type="email" name="email" required
                        class="w-full border border-steel-200 rounded px-4 py-2.5 text-navy-950 focus:outline-none focus:ring-2 focus:ring-signal focus:border-transparent transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-steel-500 mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" name="password" id="login-password" required
                            class="w-full border border-steel-200 rounded px-4 py-2.5 pr-10 text-navy-950 focus:outline-none focus:ring-2 focus:ring-signal focus:border-transparent transition">
                        <button type="button" onclick="togglePasswordVisibility('login-password', 'login-password-icon')"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-steel-400 hover:text-steel-600">
                            <svg id="login-password-icon-open" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg id="login-password-icon-closed" class="hidden h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21" />
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit"
                    class="w-full bg-navy-950 text-white py-2.5 rounded font-medium hover:bg-navy-900 transition">
                    Sign In
                </button>
            </form>
            <p class="text-center mt-4">
                <a href="{{ url_for('web.forgot_password') }}" class="text-signal text-sm hover:underline">Forgot password?</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
