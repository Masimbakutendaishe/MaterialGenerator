{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center -mt-8">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-xl font-semibold text-navy-950">Forgot Password</h1>
            <p class="text-steel-500 text-sm mt-1">Your administrator will contact you with a reset code.</p>
        </div>
        <div class="bg-white rounded-lg border border-steel-200 p-8">
            <form method="POST" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div>
                    <label class="block text-sm font-medium text-steel-500 mb-1.5">Email</label>
                    <input type="email" name="email" required class="w-full border border-steel-200 rounded px-4 py-2.5 text-navy-950 focus:outline-none focus:ring-2 focus:ring-signal">
                </div>
                <button type="submit" class="w-full bg-navy-950 text-white py-2.5 rounded font-medium hover:bg-navy-900 transition">Request Reset</button>
            </form>
            <p class="text-center mt-4">
                <a href="{{ url_for('web.reset_password') }}" class="text-signal text-sm hover:underline">Already have a code? Reset your password</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
