<div class="p-2">
    {% if notifications %}
    <div class="flex justify-between items-center px-3 py-2 border-b border-steel-100 mb-1">
        <span class="text-xs font-semibold text-steel-500 uppercase tracking-wide">Notifications</span>
        <button onclick="markAllNotificationsRead()" class="text-xs text-signal hover:underline">Mark all read</button>
    </div>
    {% endif %}
    {% for n in notifications %}
    <a href="{{ url_for('review_web.review_detail', review_id=n.link_review_id) if n.link_review_id else (url_for('generation_web.index') if n.link_job_id else '#') }}"
       onclick="markNotificationRead('{{ n.id }}')"
       class="block px-3 py-2.5 rounded text-sm hover:bg-steel-50 transition {{ 'bg-blue-50' if not n.is_read else '' }}">
        <p class="text-navy-950">{{ n.message }}</p>
        <p class="text-steel-400 text-xs mt-0.5">{{ n.created_at.strftime('%Y-%m-%d %H:%M') }}</p>
    </a>
    {% else %}
    <p class="text-steel-400 text-sm px-3 py-4 text-center">No notifications</p>
    {% endfor %}
</div>
