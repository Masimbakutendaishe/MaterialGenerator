{% extends "base.html" %}
{% block title %}Set Your Password{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center -mt-6">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-xl font-semibold text-navy-950">Set Your Password</h1>
            <p class="text-steel-500 text-sm mt-1">You're using a temporary password. Choose your own before continuing.</p>
        </div>
        <div class="bg-white rounded-xl border border-steel-200 p-8">
            <form method="POST" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div>
                    <label class="block text-sm font-medium text-steel-500 mb-1.5">New Password</label>
                    <input type="password" name="new_password" required minlength="8" class="w-full border border-steel-200 rounded px-4 py-2.5 text-navy-950 focus:outline-none focus:ring-2 focus:ring-signal">
                </div>
                <div>
                    <label class="block text-sm font-medium text-steel-500 mb-1.5">Confirm Password</label>
                    <input type="password" name="confirm_password" required minlength="8" class="w-full border border-steel-200 rounded px-4 py-2.5 text-navy-950 focus:outline-none focus:ring-2 focus:ring-signal">
                </div>
                <button type="submit" class="w-full bg-navy-950 text-white py-2.5 rounded font-medium hover:bg-navy-900 transition text-sm">Set Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
